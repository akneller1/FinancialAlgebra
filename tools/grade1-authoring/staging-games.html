<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 1 — staging Puzzle Masters</title>
<style>body{font:18px system-ui;margin:24px;background:#f3f6fc;color:#182333}main{max-width:1100px;margin:auto}.notice{background:#fff3cf;padding:16px;border-radius:12px}select{font:inherit;max-width:100%;margin:8px;padding:8px}.g1-puzzle-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.g1-puzzle-grid button{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;background:white;color:#182333;border:2px solid #465d86;border-radius:12px;min-height:190px;padding:12px}.g1-puzzle-grid button:disabled{opacity:.6;border-color:#16844d}.g1-puzzle-grid img{display:block;width:100%;height:auto}.g1-puzzle-grid button[data-face=down]{background:#274d8a;color:white}@media(max-width:650px){.g1-puzzle-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
<main><h1>Grade 1 staging Puzzle Masters</h1><p class="notice">Development review only. Banks remain unapproved. This page does not register questions with student games.</p><label>Unit<select id="unit"></select></label><label>Skill<select id="skill"></select></label><label>Level<select id="level"><option value="cp2">Remedial</option><option value="cp1">Standard</option><option value="honors">Advanced</option></select></label><div id="game"></div></main>
<script src="staging-puzzle.js"></script><script>
let outline,bank,game;const unit=document.querySelector('#unit'),skill=document.querySelector('#skill'),level=document.querySelector('#level');
async function loadUnit(){bank=await(await fetch('../../question-banks/math1/'+unit.value+'.json')).json();const u=outline.units.find(x=>x.id===unit.value);skill.replaceChildren(...u.skills.map((s,i)=>new Option(s,u.id+'-skill-'+String(i+1).padStart(2,'0'))));start()}
function start(){game=G1StagingPuzzle.mount(document.querySelector('#game'),bank.questions,skill.value,level.value,'../../');window.stagingGame=game}
unit.onchange=loadUnit;skill.onchange=start;level.onchange=start;
fetch('../../course-outlines/grade1.json').then(r=>r.json()).then(async x=>{outline=x;unit.replaceChildren(...x.units.map(u=>new Option(u.name,u.id)));await loadUnit()});
</script></html>
