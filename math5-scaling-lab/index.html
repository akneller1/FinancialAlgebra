<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scaling Lab · 5th Grade Math | Mr. K's Classroom</title><meta name="description" content="Multiply fractions with an area model and predict whether a product is greater or less than a factor.">
<link rel="stylesheet" href="../worksheet-generator/grade5/g5-tools.css?v=grade5-20261111"><link rel="stylesheet" href="../worksheet-generator/core/math-display.css">
<style>
.ts-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(16rem,1fr);gap:1rem;align-items:start}@media(max-width:860px){.ts-grid{grid-template-columns:1fr}}
.ts-ch{padding-left:1.2rem}.ts-ch li{margin:.35rem 0}.ts-ch li.done{color:#065F46;font-weight:700}.ts-ch .box{font-size:1.15rem}
.ts-big{font-family:var(--display);font-size:2.4rem;font-weight:800;text-align:center;margin:.3rem 0}
.ts-model{text-align:center}.ts-model svg{max-width:100%;height:auto;max-height:300px;width:auto}#pvChart svg{max-height:140px}#pvBlocks svg{max-height:150px}#fxModel svg{width:100%;max-height:none}#cpGrid svg{width:100%;max-height:none}
.ts-step{display:flex;align-items:center;gap:.3rem}.ts-step button{min-width:44px;min-height:44px;border-radius:12px;border:2px solid #CBD5E1;background:#fff;font-weight:800;font-size:1.2rem}
.ts-out{background:#F8FAFC;border-radius:14px;padding:.6rem .9rem;margin:.6rem 0;font-size:1.1rem}
.ts-out b{color:var(--purple)}input[type=range]{width:100%;accent-color:var(--purple);min-height:32px}
details summary{font-weight:800;cursor:pointer;color:var(--purple)}.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1;font-size:.9em}.fr .fn{border-bottom:2px solid currentColor;padding:0 .15em}
</style></head><body>
<main class="g5"><div class="ts-grid"><section class="g5-card" id="tool"><h1>Scaling Lab</h1><p class="g5-sub">Multiply fractions with an area model, then predict whether a product will be greater or less than a factor before you see it.</p>
<div class="g5-row"><div class="g5-field"><label for="scMode">Model</label><select id="scMode"><option value="f">Fraction × fraction (area)</option><option value="s">Scaling a whole number</option></select></div></div>
<div id="scF" class="g5-row"><div class="g5-field"><label>First fraction</label><div class="ts-step"><button data-k="a" data-s="-1" aria-label="first numerator down">−</button><b id="sca"></b><button data-k="a" data-s="1" aria-label="first numerator up">+</button> / <button data-k="b" data-s="-1" aria-label="first denominator down">−</button><b id="scb"></b><button data-k="b" data-s="1" aria-label="first denominator up">+</button></div></div>
<div class="g5-field"><label>Second fraction</label><div class="ts-step"><button data-k="c" data-s="-1" aria-label="second numerator down">−</button><b id="scc"></b><button data-k="c" data-s="1" aria-label="second numerator up">+</button> / <button data-k="d" data-s="-1" aria-label="second denominator down">−</button><b id="scd"></b><button data-k="d" data-s="1" aria-label="second denominator up">+</button></div></div></div>
<div id="scS" class="g5-row g5-hidden"><div class="g5-field"><label for="scN">Whole number: <b id="scNv"></b></label><input type="range" id="scN" min="2" max="12" value="6"></div>
<div class="g5-field"><label>Scale factor</label><div class="ts-step"><button data-k="p" data-s="-1" aria-label="factor numerator down">−</button><b id="scp"></b><button data-k="p" data-s="1" aria-label="factor numerator up">+</button> / <button data-k="q" data-s="-1" aria-label="factor denominator down">−</button><b id="scq"></b><button data-k="q" data-s="1" aria-label="factor denominator up">+</button></div></div>
<div class="g5-field"><label>Predict first</label><div style="display:flex;gap:.4rem;flex-wrap:wrap"><button type="button" class="g5-btn" data-guess="lt">less than</button><button type="button" class="g5-btn" data-guess="eq">equal to</button><button type="button" class="g5-btn" data-guess="gt">greater than</button></div></div></div>
<div class="ts-model" id="scModel"></div><div class="ts-out" id="scOut" aria-live="polite"></div></section>
<aside><section class="g5-card" id="challenges"></section><section class="g5-card" id="notice"></section></aside></div></main>
<script src="../worksheet-generator/grade5/g5-figs.js?v=grade5-20261111"></script><script src="../worksheet-generator/grade5/tool-shell.js?v=games-guides-only-20261112"></script>
<script>
var f={a:2,b:3,c:3,d:4,p:3,q:4},guess=null,hits=0;
function reset(){TOOL.$('scMode').value='f';TOOL.$('scN').value=6;f={a:2,b:3,c:3,d:4,p:3,q:4};guess=null;hits=0;draw();}
function area(){var a=f.a,b=f.b,c=f.c,d=f.d,S=240,s='<svg viewBox="0 0 300 290" role="img" aria-label="Unit square cut into '+(b*d)+' parts with '+(a*c)+' shaded twice">';
 for(var i=0;i<b;i++)for(var j=0;j<d;j++){var inA=i<a,inC=j<c;s+='<rect x="'+(40+i*S/b)+'" y="'+(30+(d-1-j)*S/d)+'" width="'+(S/b)+'" height="'+(S/d)+'" fill="'+(inA&&inC?'#7C3AED':inA?'#FDE68A':inC?'#BFDBFE':'#fff')+'" stroke="#1E293B" stroke-width="1.2"/>';}
 return s+'<rect x="40" y="30" width="'+S+'" height="'+S+'" fill="none" stroke="#1E293B" stroke-width="3"/><text x="160" y="20" text-anchor="middle" font-size="13" font-weight="700">1 whole</text><text x="'+(40+a*S/b/2)+'" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#B45309">'+a+'/'+b+'</text><text x="30" y="'+(30+S-c*S/d/2)+'" text-anchor="end" font-size="14" font-weight="700" fill="#1D4ED8">'+c+'/'+d+'</text></svg>';}
function bars(N,p,q){var mx=Math.max(N,N*p/q),W=520/mx,s='<svg viewBox="-20 0 620 150" role="img" aria-label="Bar of length '+N+' and bar of '+p+'/'+q+' of it">';
 s+='<rect x="40" y="25" width="'+(N*W)+'" height="34" fill="#BFDBFE" stroke="#1E293B"/><text x="34" y="47" text-anchor="end" font-size="13" font-weight="700">'+N+'</text>';
 s+='<rect x="40" y="85" width="'+(N*p/q*W)+'" height="34" fill="#7C3AED" stroke="#1E293B"/><text x="34" y="107" text-anchor="end" font-size="13" font-weight="700">× '+p+'/'+q+'</text>';
 for(var k=0;k<=mx;k++)s+='<line x1="'+(40+k*W)+'" y1="128" x2="'+(40+k*W)+'" y2="136" stroke="#1E293B"/><text x="'+(40+k*W)+'" y="148" text-anchor="middle" font-size="11">'+k+'</text>';
 return s+'</svg>';}
function draw(){var m=TOOL.$('scMode').value;TOOL.$('scF').classList.toggle('g5-hidden',m!=='f');TOOL.$('scS').classList.toggle('g5-hidden',m!=='s');
 if(m==='f'){['a','b','c','d'].forEach(function(k){TOOL.$('sc'+k).textContent=f[k]});TOOL.$('scModel').innerHTML=area();var n=f.a*f.c,dd=f.b*f.d;
  TOOL.$('scOut').innerHTML=TOOL.frac(f.a,f.b)+' × '+TOOL.frac(f.c,f.d)+' = '+TOOL.frac(n,dd)+(TOOL.gcd(n,dd)>1?' = <b>'+TOOL.mixed(n,dd)+'</b>':'')+'<br><span class="g5-note">The purple part is '+TOOL.frac(f.a,f.b)+' of '+TOOL.frac(f.c,f.d)+', so it is less than '+TOOL.frac(f.c,f.d)+(f.a<f.b?'':' — unless the first fraction is 1')+'.</span>';
  TOOL.update(O,{m:m,f:JSON.parse(JSON.stringify(f)),n:n,dd:dd,hits:hits});}
 else{var N=+TOOL.$('scN').value;TOOL.$('scNv').textContent=N;TOOL.$('scp').textContent=f.p;TOOL.$('scq').textContent=f.q;var rel=f.p<f.q?'lt':f.p===f.q?'eq':'gt',words={lt:'less than',eq:'equal to',gt:'greater than'};
  if(!guess){TOOL.$('scModel').innerHTML='';TOOL.$('scOut').innerHTML='Is '+N+' × '+TOOL.frac(f.p,f.q)+' less than, equal to or greater than '+N+'? Predict first.';}
  else{TOOL.$('scModel').innerHTML=bars(N,f.p,f.q);var right=guess===rel;TOOL.$('scOut').innerHTML=(right?'✓ ':'Not quite. ')+N+' × '+TOOL.frac(f.p,f.q)+' = <b>'+TOOL.mixed(N*f.p,f.q)+'</b>, which is '+words[rel]+' '+N+' because '+TOOL.frac(f.p,f.q)+' is '+words[rel]+' 1.';}
  TOOL.update(O,{m:m,N:N,p:f.p,q:f.q,guess:guess,rel:rel,hits:hits});}}
Array.prototype.forEach.call(document.querySelectorAll('[data-k]'),function(b){b.onclick=function(){var k=b.dataset.k,s=+b.dataset.s;f[k]+=s;f.b=Math.min(10,Math.max(2,f.b));f.d=Math.min(10,Math.max(2,f.d));f.a=Math.min(f.b,Math.max(1,f.a));f.c=Math.min(f.d,Math.max(1,f.c));f.q=Math.min(8,Math.max(2,f.q));f.p=Math.min(3*f.q,Math.max(1,f.p));guess=null;draw();}});
Array.prototype.forEach.call(document.querySelectorAll('[data-guess]'),function(b){b.onclick=function(){guess=b.dataset.guess;var rel=f.p<f.q?'lt':f.p===f.q?'eq':'gt';if(guess===rel)hits++;draw();}});
['scMode','scN'].forEach(function(id){TOOL.$(id).oninput=function(){guess=null;draw();};});
var O={title:'Scaling Lab',reset:reset,challenges:[
 {text:'Show 2/3 × 3/4. What fraction is purple?',test:function(s){return s.m==='f'&&s.f.a===2&&s.f.b===3&&s.f.c===3&&s.f.d===4}},
 {text:'Make a product of 1/2 with fractions other than 2/3 and 3/4.',test:function(s){return s.m==='f'&&s.n*2===s.dd&&!(s.f.a===2&&s.f.b===3&&s.f.c===3&&s.f.d===4)}},
 {text:'Switch to scaling. Predict correctly for a factor less than 1.',test:function(s){return s.m==='s'&&s.guess==='lt'&&s.rel==='lt'}},
 {text:'Predict correctly for a factor greater than 1.',test:function(s){return s.m==='s'&&s.guess==='gt'&&s.rel==='gt'}},
 {text:'Find a factor that keeps the whole number the same.',test:function(s){return s.m==='s'&&s.rel==='eq'&&s.guess==='eq'}},
 {text:'Make 5 correct predictions in a row of practice.',test:function(s){return s.hits>=5}}],
 notice:['A fraction of a fraction is a part of a part, so the product of two fractions less than 1 is less than both.','Multiplying by a fraction less than 1 shrinks a number; by a fraction greater than 1 stretches it; by a fraction equal to 1 keeps it.','You can compare the product with the factor without computing: compare the other factor with 1.'],
 teacher:['Have students write their prediction and reason before tapping a button.','Ask: what fraction would make 12 become 9? 15? 12?','Connect the area model to the rule: multiply numerators and denominators.']};
TOOL.init(O);reset();
</script></body></html>
