name: Verify Grade 2 question bank
on:
  push:
    branches: [main, integration/grade2-staging-preview]
    paths:
      - 'question-banks/math2/**'
      - 'question-banks/assets/math2/**'
      - 'tools/grade2-authoring/**'
      - 'docs/math2/**'
      - '.github/workflows/verify-grade2.yml'
  pull_request:
    paths:
      - 'question-banks/math2/**'
      - 'question-banks/assets/math2/**'
      - 'tools/grade2-authoring/**'
      - 'docs/math2/**'
      - '.github/workflows/verify-grade2.yml'
permissions:
  contents: read
jobs:
  verify-grade2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Require Grade 2 preview bank boundaries
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          entries=[b for b in json.loads((root/'manifest.json').read_text())['banks'] if b.get('courseId')=='math2']
          assert len(entries)==12 and len({b['unitId'] for b in entries})==12, 'Expected 12 unique Grade 2 banks'
          assert all(b.get('approved') is False and b.get('preview') is True for b in entries), 'No Grade 2 bank may be approved'
          assert all((root/b['path']).is_file() for b in entries), 'Missing Grade 2 practice bank'
          assert not (root/'question-banks/manifest.json').exists(), 'Source cannot contain built player manifest'
          print('Grade 2 source manifest: 12 preview banks, no public approval')
          PY
      - name: Verify Grade 2 practice questions
        working-directory: tools/grade2-authoring
        run: python3 verify.py
      - name: Verify separate Grade 2 Understanding Check questions
        working-directory: tools/grade2-authoring
        env:
          VERIFY_CHECKS: '1'
        run: python3 verify.py
      - name: Audit grade-level semantics, duplication and difficulty
        working-directory: tools/grade2-authoring
        run: python3 audit.py
