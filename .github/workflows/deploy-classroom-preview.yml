name: Deploy integrated Classroom development site
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/assemble-classroom-preview.mjs'
      - 'scripts/test-classroom-preview.cjs'
      - '.github/workflows/deploy-classroom-preview.yml'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: integrated-development-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          repository: akneller1/classroom
          ref: main
          path: classroom
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate course sources
        working-directory: source
        run: npm test
      - name: Assemble the actual Classroom shell and native generators
        working-directory: source
        env:
          CLASSROOM_SOURCE_DIR: ../classroom
        run: node scripts/assemble-classroom-preview.mjs
      - name: Verify integrated development routes and native generator contracts
        working-directory: source
        env:
          CLASSROOM_SOURCE_DIR: ../classroom
        run: node scripts/test-classroom-preview.cjs
      - name: Install Chromium for Grade 3 browser regression (PR only)
        if: github.event_name == 'pull_request'
        working-directory: source
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Exercise Grade 3 games, study guides and student links in Chromium
        if: github.event_name == 'pull_request'
        working-directory: source
        env:
          G3_SITE: ../classroom/_site
          G3_PREFIX: grade3/
        run: node tools/grade3-authoring/tests/browser-grade3.cjs --quick
      - uses: actions/upload-pages-artifact@v3
        with:
          path: classroom/_site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the automatic branch Pages build
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt=0;attempt<60;attempt++) {
              const {data}=await github.rest.actions.listWorkflowRunsForRepo({owner:context.repo.owner,repo:context.repo.repo,branch:'main',per_page:100});
              const pending=data.workflow_runs.filter(run=>run.id!==context.runId&&run.name==='pages build and deployment'&&run.status!=='completed');
              if (!pending.length) return;
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            core.setFailed('Automatic Pages deployment did not finish within ten minutes.');
      - id: deployment
        uses: actions/deploy-pages@v4
