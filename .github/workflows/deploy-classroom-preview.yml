name: Deploy integrated Classroom development site
on:
  push:
    branches: [main, integration/grade2-staging-preview]
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/assemble-classroom-preview.mjs'
      - 'scripts/test-classroom-preview.cjs'
      - 'tools/grade1-authoring/**'
      - 'question-banks/math1/**'
      - 'question-banks/assets/math1/**'
      - 'worksheet-generator/grade1/**'
      - 'worksheet-generator/grade1-*.html'
      - 'tools/grade2-authoring/**'
      - 'question-banks/math2/**'
      - 'worksheet-generator/elementary/**'
      - 'worksheet-generator/grade2/**'
      - 'manifest.json'
      - '.github/workflows/deploy-classroom-preview.yml'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: integrated-development-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          repository: akneller1/classroom
          ref: main
          path: classroom
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate course sources
        working-directory: source
        run: npm test
      - name: Assemble the actual Classroom shell and native generators
        working-directory: source
        env:
          CLASSROOM_SOURCE_DIR: ../classroom
        run: node scripts/assemble-classroom-preview.mjs
      - name: Verify integrated development routes and native generator contracts
        working-directory: source
        env:
          CLASSROOM_SOURCE_DIR: ../classroom
        run: node scripts/test-classroom-preview.cjs
      - name: Install Chromium for Grade 3 browser regression
        working-directory: source
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Exercise Grade 3 games, study guides and student links in Chromium
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        working-directory: source
        env:
          G3_SITE: ../classroom/_site
          G3_PREFIX: grade3/
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tools/grade3-authoring/tests/browser-grade3.cjs
          else
            node tools/grade3-authoring/tests/browser-grade3.cjs --quick
          fi
      - name: Exercise Grade 3 native generators and printable answer keys in Chromium
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        working-directory: source
        env:
          G3_BASE: http://127.0.0.1:8766/
          G3_SET: grade3
        run: |
          python3 -m http.server 8766 --directory ../classroom/_site > /tmp/grade3-preview-http.log 2>&1 &
          echo $! > /tmp/grade3-preview-http.pid
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tools/grade3-authoring/tests/browser-generators.cjs --all
          else
            node tools/grade3-authoring/tests/browser-generators.cjs
          fi
          kill $(cat /tmp/grade3-preview-http.pid)
      - name: Exercise Grade 2 Understanding Checks in Chromium
        working-directory: source
        timeout-minutes: 8
        env:
          G2_SITE: ../classroom/_site
          G2_PREFIX: grade2/
          G3_ONLY: checks
        run: node tools/grade2-authoring/tests/browser-grade2.cjs --quick
      - name: Exercise Grade 2 flashcards and student links in Chromium
        working-directory: source
        timeout-minutes: 8
        env:
          G2_SITE: ../classroom/_site
          G2_PREFIX: grade2/
        run: |
          G3_ONLY=cards node tools/grade2-authoring/tests/browser-grade2.cjs
          G3_ONLY=links node tools/grade2-authoring/tests/browser-grade2.cjs
      - name: Play through Grade 2 games in Chromium
        working-directory: source
        timeout-minutes: 12
        env:
          G2_SITE: ../classroom/_site
          G2_PREFIX: grade2/
          G3_ONLY: games
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tools/grade2-authoring/tests/browser-grade2.cjs
          else
            node tools/grade2-authoring/tests/browser-grade2.cjs --quick
          fi
      - name: Exercise Grade 2 native generators and printable answer keys in Chromium
        working-directory: source
        env:
          G2_BASE: http://127.0.0.1:8767/
          G2_SET: grade2
        run: |
          python3 -m http.server 8767 --directory ../classroom/_site > /tmp/grade2-preview-http.log 2>&1 &
          echo $! > /tmp/grade2-preview-http.pid
          trap 'kill $(cat /tmp/grade2-preview-http.pid) || true' EXIT
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tools/grade2-authoring/tests/browser-generators.cjs --all
          else
            node tools/grade2-authoring/tests/browser-generators.cjs
          fi
      - name: Exercise Grade 1 games, Understanding Checks and student links
        working-directory: source
        timeout-minutes: 15
        env:
          G1_SITE: ../classroom/_site
          G1_PREFIX: grade1/
        run: |
          G3_ONLY=checks node tools/grade1-authoring/tests/browser-grade1.cjs
          G3_ONLY=cards node tools/grade1-authoring/tests/browser-grade1.cjs
          G3_ONLY=links node tools/grade1-authoring/tests/browser-grade1.cjs
          G3_ONLY=games node tools/grade1-authoring/tests/browser-grade1.cjs --quick
      - name: Exercise Grade 1 native generators and answer keys
        working-directory: source
        timeout-minutes: 15
        env:
          G1_BASE: http://127.0.0.1:8768/
          G1_SET: grade1
        run: |
          python3 -m http.server 8768 --directory ../classroom/_site > /tmp/grade1-preview-http.log 2>&1 &
          G1_HTTP_PID=$!
          trap 'kill "$G1_HTTP_PID" || true' EXIT
          node tools/grade1-authoring/tests/browser-generators.cjs --all
      - uses: actions/upload-pages-artifact@v3
        with:
          path: classroom/_site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the automatic branch Pages build
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt=0;attempt<60;attempt++) {
              const {data}=await github.rest.actions.listWorkflowRunsForRepo({owner:context.repo.owner,repo:context.repo.repo,branch:'main',per_page:100});
              const pending=data.workflow_runs.filter(run=>run.id!==context.runId&&run.name==='pages build and deployment'&&run.status!=='completed');
              if (!pending.length) return;
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            core.setFailed('Automatic Pages deployment did not finish within ten minutes.');
      - id: deployment
        uses: actions/deploy-pages@v4
