name: Validate Financial Algebra
on:
  push:
  pull_request:
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: |
          find src financial scripts -type f \( -name "*.js" -o -name "*.mjs" \) -exec node --check {} \;
      - name: Test finance calculations, questions, and UI integration assets
        run: npm test
      - name: Validate Grade 5 banks, diagrams, resource navigation and JS
        run: |
          node --check grade5-resource-catalog.js
          node scripts/test-grade5.cjs
      - name: Verify Grade 5 answers independently
        run: python3 tools/grade5-authoring/verify.py
      - name: Grade 5 banks rebuild exactly from the generators, and their text passes the display lint (Grade 5 audit 2026-11-19)
        run: |
          G5_NODRAW=1 python3 tools/grade5-authoring/build.py
          python3 tools/grade5-authoring/yearend.py
          git diff --exit-code -- math5 tools/grade5-authoring/out 'math5-practice-test-*/*.html' math5-reference-sheet/index.html math5-pacing-guide/index.html 'math5-*-lab/*.html'
          node tools/grade5-authoring/tests/display-lint.cjs

      - name: Verify Grade 3 integration source, skills and diagram paths
        run: node scripts/check-grade3-source.mjs
