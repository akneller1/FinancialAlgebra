name: Validate Financial Algebra
on:
  push:
  pull_request:
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: |
          find src financial scripts -type f \( -name "*.js" -o -name "*.mjs" \) -exec node --check {} \;
      - name: Test finance calculations, questions, and UI integration assets
        run: npm test
