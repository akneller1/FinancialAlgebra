name: Validate Financial Algebra
on:
  push:
  pull_request:
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic financial model and question bank tests
        run: npm test
