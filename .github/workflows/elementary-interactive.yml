name: Grade 1–3 Interactive Math
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'tools/elementary-interactive/**'
      - 'tools/grade1-authoring/interactive/**'
      - 'tools/grade2-authoring/interactive/**'
      - 'tools/grade3-authoring/interactive/**'
      - 'tools/grade1-authoring/staging/assemble-grade1.mjs'
      - 'artifacts/math1-*/**'
      - 'artifacts/math2-*/**'
      - 'artifacts/math3-*/**'
      - 'worksheet-generator/elementary/el-tool-*'
      - 'worksheet-generator/elementary/el-tools.css'
      - '.github/workflows/elementary-interactive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    name: Pages match their definitions; every challenge reachable in the browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild pages and manifests; fail if the committed copies differ
        run: |
          python3 tools/elementary-interactive/build.py
          git diff --exit-code -- artifacts tools/grade1-authoring/interactive tools/grade2-authoring/interactive tools/grade3-authoring/interactive
      - name: Check that every tool has its worksheet, teacher key and thumbnail
        run: |
          node -e "const fs=require('fs');let bad=0;for(const g of [1,2,3])for(const t of JSON.parse(fs.readFileSync('tools/grade'+g+'-authoring/interactive/manifest.json','utf8')).tools)for(const f of ['artifacts/'+t.slug+'/worksheet.pdf','artifacts/'+t.slug+'/teacher-key.pdf','thumbs/'+t.slug+'.svg'])if(!fs.existsSync(f)){bad++;console.log('missing',f);}process.exit(bad?1:0)"
      - name: Browser test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tools/elementary-interactive/tests/browser-tools.cjs
