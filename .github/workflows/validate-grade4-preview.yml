name: Validate Grade 4 integrated Classroom preview
on:
  push:
    branches: [grade4-framework-migration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          repository: akneller1/classroom
          ref: main
          path: classroom
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Grade 4 source banks and resources
        working-directory: source
        run: npm test
      - name: Assemble Grade 4 in the real Classroom shell
        working-directory: source
        env:
          CLASSROOM_SOURCE_DIR: ../classroom
        run: node scripts/assemble-classroom-preview.mjs
      - name: Verify all integrated Grade 4 routes and generators
        working-directory: source
        env:
          CLASSROOM_SOURCE_DIR: ../classroom
        run: node scripts/test-classroom-preview.cjs
      - name: Install browser test dependencies
        working-directory: source
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser smoke test of integrated Grade 4 course
        working-directory: source
        env:
          G4_BASE: http://127.0.0.1:8771/
        run: |
          python3 -m http.server 8771 --directory ../classroom/_site > /tmp/grade4-server.log 2>&1 &
          sleep 3
          node tools/grade4-authoring/tests/browser-preview.cjs
      - name: Browser test Grade 4 games, study guides and student links
        working-directory: source
        env:
          G4_SITE: ../classroom/_site
          G4_PREFIX: grade4/
        run: node tools/grade4-authoring/tests/browser-grade4.cjs --quick
      - name: Browser test Grade 4 native generators
        working-directory: source
        env:
          G4_BASE: http://127.0.0.1:8771/worksheet-generator/
          G4_SET: grade4
        run: node tools/grade4-authoring/tests/browser-generators.cjs
