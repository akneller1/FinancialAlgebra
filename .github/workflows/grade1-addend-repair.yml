name: Grade 1 — repair wrong addend structures on development branch
on:
  push:
    branches: [grade1-question-bank]
    paths:
      - 'tools/grade1-authoring/repair_addend_structure.py'
      - '.github/workflows/grade1-addend-repair.yml'
permissions:
  contents: write
concurrency:
  group: grade1-addend-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grade1-question-bank
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Replace only misaligned addition questions
        run: python tools/grade1-authoring/repair_addend_structure.py
      - name: Independently validate all arithmetic and diagrams
        run: python tools/grade1-authoring/verify1.py
      - name: Check all banks and keep editorial approval pending
        run: node scripts/audit-grade1-bank.cjs
      - name: Independently check question semantics
        run: node scripts/audit-grade1-semantics.cjs
      - name: Confirm no remaining invalid addend structures
        run: |
          node scripts/audit-grade1-alignment.cjs > /tmp/grade1-alignment.log
          node -e "const r=require('./grade1-alignment-report.json'); if(r.counts.strictAdd100Mismatches) {console.log('Still incorrect:',r.counts.strictAdd100Mismatches);process.exit(1)};console.log('All targeted addition structures match Grade 1 learning targets.')"
      - name: Commit only repaired bank and associated diagram/check files
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add question-banks/math1/adding-within-100.json question-banks/math1/meta/adding-within-100.meta.json tools/grade1-authoring/out/adding-within-100.checks.json question-banks/assets/math1/adding-within-100/
          if git diff --cached --quiet; then
            echo "No bank corrections required."
          else
            git commit -m "Repair Grade 1 addend width and regrouping alignment [skip ci]"
            git push origin HEAD:grade1-question-bank
          fi
# No production publishing or approval changes.
