name: Grade 1 target alignment — rebuild and verify development bank
on:
  push:
    branches: [grade1-question-bank]
    paths:
      - '.github/workflows/grade1-alignment-rebuild.yml'
      - 'tools/grade1-authoring/*.py'
      - 'tools/grade1-authoring/units/*.py'
      - 'tools/grade1-authoring/staging-*'
      - 'scripts/test-grade1-staging.cjs'
      - 'scripts/test-grade1-puzzle-browser.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grade1-target-rebuild
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.ref == 'refs/heads/grade1-question-bank'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: grade1-question-bank
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Rebuild target-specific questions and every referenced diagram
        run: python -u tools/grade1-authoring/build1.py
      - name: Verify mathematics, diagrams, IDs, standards, quotas and unchanged approval
        run: |
          python tools/grade1-authoring/verify1.py
          node scripts/audit-grade1-bank.cjs
          node scripts/audit-grade1-semantics.cjs
          node scripts/audit-grade1-alignment.cjs > /tmp/alignment.json
          node -e "const r=require('./grade1-alignment-report.json');if(r.counts.hardMismatch||r.counts.strictAdd100Mismatches||r.counts.domainFacts)process.exit(1)"
          node scripts/test-grade1-staging.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect all skills and solve every scoped puzzle in Chromium
        run: |
          python -m http.server 8765 > /tmp/grade1-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/tools/grade1-authoring/preview.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-grade1-browser.cjs
          node scripts/test-grade1-puzzle-browser.cjs
      - name: Save verified banks only on development branch
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add question-banks/math1 question-banks/assets/math1 tools/grade1-authoring/out
          git add grade1-qa-report.json grade1-qa-report.md grade1-semantic-report.json grade1-semantic-report.md grade1-alignment-report.json grade1-alignment-report.md
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild all Grade 1 targets with verified skill-specific content [skip ci]'
            git push origin HEAD:grade1-question-bank
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade1-target-alignment-validation
          path: |
            grade1-browser-results/
            grade1-qa-report.*
            grade1-semantic-report.*
            grade1-alignment-report.*
