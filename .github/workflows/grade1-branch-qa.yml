name: Grade 1 question bank — branch-only QA

on:
  push:
    branches: [grade1-question-bank]
    paths:
      - 'question-banks/math1/**'
      - 'question-banks/assets/math1/**'
      - 'tools/grade1-authoring/**'
      - 'course-outlines/grade1.json'
      - 'scripts/audit-grade1-bank.cjs'
      - 'scripts/audit-grade1-semantics.cjs'
      - 'scripts/test-grade1-browser.cjs'
      - '.github/workflows/grade1-branch-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grade1-branch-review
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagram validation dependency
        run: python -m pip install pillow
      - name: Independently verify Grade 1 mathematics and PNG diagrams
        run: python tools/grade1-authoring/verify1.py
      - name: Validate shared Classroom adapter and all eight banks
        run: node scripts/audit-grade1-bank.cjs
      - name: Independently check question wording versus mathematical answers
        run: node scripts/audit-grade1-semantics.cjs
      - name: Install Chromium browser for student-facing sample render checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve local development-only Grade 1 question inspector
        run: |
          python3 -m http.server 8765 --directory . > /tmp/grade1-viewer.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/tools/grade1-authoring/preview.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/grade1-viewer.log
          exit 1
      - name: Check all 93 skills and every question format in Chromium
        run: node scripts/test-grade1-browser.cjs
      - name: Upload Grade 1 audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade1-branch-audit
          path: |
            grade1-qa-report.json
            grade1-qa-report.md
            grade1-semantic-report.json
            grade1-semantic-report.md
            grade1-browser-results/
          if-no-files-found: warn
# Browser preview test lives in scripts/test-grade1-browser.cjs for optional later use.
# It is not a release gate while known semantic errors block the course.
# No deploy job and no published manifest changes. The branch is review-only.
